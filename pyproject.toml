[project]
name = "aisafetyfeeds"
version = "0.1.0"
description = "Clean, public RSS endpoints for AI safety research blogs that lack usable feeds"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "cssselect>=1.2",
    "pydantic>=2.7",
    "cyclopts>=3.0",
]

[project.scripts]
aisafetyfeeds = "aisafetyfeeds.__main__:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8", "feedparser>=6.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisafetyfeeds"]

[tool.ruff]
line-length = 100
