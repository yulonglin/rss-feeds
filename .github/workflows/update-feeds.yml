name: Update feeds

on:
  schedule:
    # 00:00, 08:00 and 16:00 UTC. GitHub disables scheduled workflows after 60 days
    # with no repository activity; each successful refresh commits, which resets that.
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
  push:
    branches: [main, claude/ci-newsletter-formatting-ucsqfq]

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Never re-resolve on CI: a lockfile rewritten here would dirty the tree and make
      # the commit step stage nothing, which is exactly how this job failed once.
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: DEBUG dump feeds
        continue-on-error: true
        run: |
          cat > /tmp/dump.py <<'PYEOF'
          import httpx, re
          H={"User-Agent": "Mozilla/5.0 rss-feeds/0.1 (+https://github.com/yulonglin/rss-feeds)"}
          for u in ["https://www.readtangle.com/feed", "https://www.readtangle.com/rss", "https://readtangle.com/feed", "https://rss.beehiiv.com/feeds/tangle", "https://www.readtangle.com/"]:
              try:
                  r = httpx.get(u, follow_redirects=True, headers=H, timeout=30)
                  print("==", u, r.status_code, r.url, len(r.text), r.headers.get("content-type"))
                  t = r.text
                  print(re.findall(r'<link[^>]+(?:rss|atom)[^>]*>', t)[:5])
                  if "<item" in t or "<entry" in t:
                      print(t[:800]); print("TITLES", re.findall(r"<title>(.*?)</title>", t, re.S)[:25])
                      i = t.find("<item"); print("ITEM1", t[i:i+6000])
              except Exception as e:
                  print("ERR", u, e)
          for u in ["https://simonwillison.net/atom/entries/", "https://simonwillison.net/atom/everything/"]:
              r = httpx.get(u, follow_redirects=True, headers=H, timeout=30)
              t = r.text
              print("==", u, r.status_code, len(t), "entries", t.count("<entry"))
              print("TITLES", re.findall(r"<entry>.*?<title>(.*?)</title>", t, re.S)[:30])
              print("IDS", re.findall(r"<entry>.*?<link[^>]*href=\"([^\"]+)\"", t, re.S)[:30])
          PYEOF
          uv run python /tmp/dump.py

      - name: Tests
        run: uv run --group dev pytest -q

      - name: Rebuild feeds
        id: rebuild
        continue-on-error: true
        run: uv run rssfeeds

      - name: Validate every feed parses
        if: always()
        run: uv run --group dev python scripts/validate.py

      - name: Commit whatever refreshed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh feeds ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Open or update an issue when a source breaks
        if: always() && steps.rebuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Feed refresh is failing"
          body="A source did not refresh cleanly. The affected feed kept its previous contents rather than publishing an empty or truncated file.

          Most likely cause: the upstream page changed layout and no longer matches the selectors in \`src/rssfeeds/sources/\`.

          Run log: $RUN_URL

          If the change is real and the feed genuinely shrank, re-run with \`uv run rssfeeds --allow-shrink\`."
          existing=$(gh issue list --state open --label feed-broken --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create feed-broken --color b60205 --description "A source stopped refreshing" 2>/dev/null || true
            gh issue create --title "$title" --label feed-broken --body "$body"
          fi

      - name: Fail the run if a source was unreachable
        if: always() && steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::At least one source failed to refresh; its feed kept its previous contents."
          exit 1
