name: Update feeds

on:
  schedule:
    # 00:00, 08:00 and 16:00 UTC. GitHub disables scheduled workflows after 60 days
    # with no repository activity; each successful refresh commits, which resets that.
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
  push:
    branches: [main, claude/ci-newsletter-formatting-ucsqfq]

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Never re-resolve on CI: a lockfile rewritten here would dirty the tree and make
      # the commit step stage nothing, which is exactly how this job failed once.
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: DEBUG dump page
        run: |
          cat > /tmp/dump.py <<'PYEOF'
          import httpx, re
          from lxml import html as lx
          H={"User-Agent": "rss-feeds/0.1 (+https://github.com/yulonglin/rss-feeds)"}
          for u in ["https://tldr.tech/api/rss/ai"]:
              r = httpx.get(u, follow_redirects=True, headers=H)
              print("STATUS", r.status_code, r.url, len(r.text), r.headers.get("content-type"))
              t = r.text
              print(t[:1500])
              i = t.find("<item>"); j = t.find("</item>", i); k = t.find("</item>", j+5)
              print("=== ITEM1 ===")
              print(t[i:j+7][:9000])
              print("=== ITEM2 HEAD ===")
              print(t[j:k][:1500])
              print("NITEMS", t.count("<item>"))
              links = re.findall(r"<link>([^<]+)</link>", t)[:6]
              print(links)
          link = re.findall(r"<item>.*?<link>([^<]+)</link>", t, re.S)[0]
          r = httpx.get(link, follow_redirects=True, headers=H)
          print("PAGE", r.status_code, r.url, len(r.text))
          doc = lx.fromstring(r.text)
          body = doc.find("body")
          def walk(el, d=0):
              if not isinstance(el.tag, str) or el.tag in ("script", "style", "svg", "path", "head"): return
              attrs = " ".join(f'{k}="{v[:60]}"' for k, v in el.attrib.items() if k in ("class", "id", "href"))
              txt = (el.text or "").strip().replace("\n", " ")[:70]
              print("  " * d + f"<{el.tag} {attrs}> {txt}")
              for c in el: walk(c, d + 1)
          walk(body)
          PYEOF
          uv run python /tmp/dump.py
          exit 1

      - name: Tests
        run: uv run --group dev pytest -q

      - name: Rebuild feeds
        id: rebuild
        continue-on-error: true
        run: uv run rssfeeds

      - name: Validate every feed parses
        if: always()
        run: uv run --group dev python scripts/validate.py

      - name: Commit whatever refreshed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh feeds ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Open or update an issue when a source breaks
        if: always() && steps.rebuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Feed refresh is failing"
          body="A source did not refresh cleanly. The affected feed kept its previous contents rather than publishing an empty or truncated file.

          Most likely cause: the upstream page changed layout and no longer matches the selectors in \`src/rssfeeds/sources/\`.

          Run log: $RUN_URL

          If the change is real and the feed genuinely shrank, re-run with \`uv run rssfeeds --allow-shrink\`."
          existing=$(gh issue list --state open --label feed-broken --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create feed-broken --color b60205 --description "A source stopped refreshing" 2>/dev/null || true
            gh issue create --title "$title" --label feed-broken --body "$body"
          fi

      - name: Fail the run if a source was unreachable
        if: always() && steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::At least one source failed to refresh; its feed kept its previous contents."
          exit 1
