name: Update feeds

on:
  schedule:
    # 00:00, 08:00 and 16:00 UTC. GitHub disables scheduled workflows after 60 days
    # with no repository activity; each successful refresh commits, which resets that.
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:
  push:
    branches: [main, claude/ci-newsletter-formatting-ucsqfq]

permissions:
  contents: write
  issues: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Never re-resolve on CI: a lockfile rewritten here would dirty the tree and make
      # the commit step stage nothing, which is exactly how this job failed once.
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: DEBUG dump feeds
        continue-on-error: true
        run: |
          cat > /tmp/dump.py <<'PYEOF'
          import httpx, re
          from collections import Counter
          from xml.etree import ElementTree as ET
          from lxml import html as lx
          H={"User-Agent": "Mozilla/5.0 rss-feeds/0.1 (+https://github.com/yulonglin/rss-feeds)"}
          NS={"content":"http://purl.org/rss/1.0/modules/content/","dc":"http://purl.org/dc/elements/1.1/"}
          r = httpx.get("https://www.readtangle.com/rss/", follow_redirects=True, headers=H, timeout=60)
          ch = ET.fromstring(r.content).find("channel")
          items = ch.findall("item")
          print("TANGLE", len(items), len(r.content))
          for it in items:
              cats = [c.text for c in it.findall("category")]
              body = it.findtext("content:encoded", namespaces=NS) or ""
              print("-", it.findtext("pubDate")[:16], "|", it.findtext("title"), "|", it.findtext("link"), "|", cats, "|", it.findtext("dc:creator", namespaces=NS), "|", len(body))
          done = set()
          for it in items:
              link = it.findtext("link")
              kind = link.split("/")[3]
              if kind in done: continue
              done.add(kind)
              body = it.findtext("content:encoded", namespaces=NS) or ""
              doc = lx.fromstring(f"<div>{body}</div>")
              print("=== OUTLINE", kind, it.findtext("title"))
              for el in doc.iter():
                  if el.tag in ("h1","h2","h3","h4") or (el.tag in ("p",) and el.text_content().strip().isupper() and len(el.text_content())<60) or (el.tag=="strong" and len(el.text_content())<50 and el.getparent().tag=="p" and el.getparent().text_content().strip()==el.text_content().strip()):
                      print("  ", el.tag, el.get("id"), (el.text_content() or "").strip()[:90])
                  if el.tag=="div" and el.get("class") and "kg-" in el.get("class"):
                      print("  [div]", el.get("class")[:60], el.text_content().strip()[:60])
          for u in ["https://www.pon.harvard.edu/feed/", "https://www.pon.harvard.edu/daily/feed/"]:
              r = httpx.get(u, follow_redirects=True, headers=H, timeout=60)
              print("== PON", u, r.status_code, r.url, len(r.content))
              try:
                  ch = ET.fromstring(r.content).find("channel")
                  for it in ch.findall("item"):
                      body = it.findtext("content:encoded", namespaces=NS) or it.findtext("description") or ""
                      print("-", (it.findtext("pubDate") or "")[:16], "|", it.findtext("title"), "|", it.findtext("link"), "|", [c.text for c in it.findall("category")][:6], "|", len(body))
                  body = ch.find("item").findtext("content:encoded", namespaces=NS) or ch.find("item").findtext("description")
                  print("FIRSTBODY", body[:2500])
              except Exception as e:
                  print("ERR", e, r.text[:500])
          PYEOF
          uv run python /tmp/dump.py

      - name: Tests
        run: uv run --group dev pytest -q

      - name: Rebuild feeds
        id: rebuild
        continue-on-error: true
        run: uv run rssfeeds

      - name: Validate every feed parses
        if: always()
        run: uv run --group dev python scripts/validate.py

      - name: Commit whatever refreshed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Refresh feeds ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - name: Open or update an issue when a source breaks
        if: always() && steps.rebuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Feed refresh is failing"
          body="A source did not refresh cleanly. The affected feed kept its previous contents rather than publishing an empty or truncated file.

          Most likely cause: the upstream page changed layout and no longer matches the selectors in \`src/rssfeeds/sources/\`.

          Run log: $RUN_URL

          If the change is real and the feed genuinely shrank, re-run with \`uv run rssfeeds --allow-shrink\`."
          existing=$(gh issue list --state open --label feed-broken --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create feed-broken --color b60205 --description "A source stopped refreshing" 2>/dev/null || true
            gh issue create --title "$title" --label feed-broken --body "$body"
          fi

      - name: Fail the run if a source was unreachable
        if: always() && steps.rebuild.outcome == 'failure'
        run: |
          echo "::error::At least one source failed to refresh; its feed kept its previous contents."
          exit 1
